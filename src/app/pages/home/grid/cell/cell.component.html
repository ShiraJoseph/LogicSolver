<button
  #cellButton
  type="button"
  class="cell"
  [class.selected]="isSelected()"
  [class.tab-stop]="isTabStop()"
  [class.solved]="isSolved()"
  [attr.aria-label]="cellLabel()"
  tabindex="-1"
  [style.background-color]="hoverColor()"
  (mouseenter)="onHover()"
  (focus)="onFocus()"
  (keydown)="onKeydown($event)"
  (pointerdown)="onClickCell($event)">{{ cellValue() }}
</button>
