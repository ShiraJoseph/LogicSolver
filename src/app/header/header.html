<div
  (mouseover)="showMinus()"
  (mouseleave)="hideMinus()"
  (blur)="hideMinus()"
  class="header"
  [ngClass]="{vertical: tile2().type==='TOP_OPTION_HEADER' || tile2().type==='LEFT_FEATURE_HEADER'}">
  <input
    [class]="tile2().type"
    (keyup.enter)="updateHeader2($event)"
    (keyup.tab)="moveNext($event)"
    (blur)="updateHeader2($event)"
    [value]="tile2().text">
  @if (shouldShowMinus2()) {
    <button
      (mouseover)="showMinus()"
      (mouseleave)="hideMinus()"
      (blur)="hideMinus()"
      class="delete"
      [disabled]="isDeleteDisabled2()"
      (click)="deleteHeader2()">-
    </button>
  }
</div>
