<div
  (mouseover)="showMinus()"
  (mouseleave)="hideMinus()"
  class="header"
  [style.background-color]="backgroundColor()"
  [class.vertical]="isVertical()">
  <input
    name="header-input"
    [class]="tile().type"
    [style.color]="textColor()"
    (keyup.enter)="updateHeader($event)"
    (blur)="updateHeader($event)"
    [value]="tile().text">
  @if (shouldShowMinus()) {
    <button
      (mouseover)="showMinus()"
      (mouseleave)="hideMinus()"
      (blur)="hideMinus()"
      class="delete"
      [disabled]="isDeleteDisabled()"
      (click)="deleteHeader()">-
    </button>
  }
</div>
