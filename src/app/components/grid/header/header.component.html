<div
  class="header"
  [style.background-color]="backgroundColor()"
  [style.color]="textColor()"
  [class.vertical]="isVertical()">
  <input
    #headerInput
    name="header-input"
    aria-keyshortcuts="ArrowDown"
    [attr.aria-label]="nameLabel()"
    [class]="tile().type"
    (keydown.arrowdown)="$event.preventDefault(); deleteButton.focus()"
    (keyup.enter)="headerInput.blur()"
    (keyup.escape)="headerInput.blur()"
    (blur)="onChangeName($event)"
    [value]="tile().text">
  <button
    #deleteButton
    tabindex="-1"
    class="delete"
    [attr.aria-label]="deleteLabel()"
    [disabled]="isDeleteDisabled()"
    (keydown.arrowup)="$event.preventDefault(); headerInput.focus()"
    (click)="onClickDelete()">-
  </button>
</div>
