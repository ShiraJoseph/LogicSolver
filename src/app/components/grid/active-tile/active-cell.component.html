<div
  class="cell-active">
  <div class="xo-buttons">
    <div
      class="xo-button"
      (click)="updateTile2(tile(), CellText.O)">O
    </div>
    <div
      class="xo-button"
      (click)="updateTile2(tile(), CellText.X)">X
    </div>
  </div>

  <div class="clear-buttons">
    <div
      class="clear-button"
      (click)="updateTile2(tile(), CellText.EMPTY)">clear
    </div>
    <div
      class="clear-button"
      (click)="updateTile2(tile(), cellValue())">x
    </div>
  </div>
</div>
