<div class="grid-buttons">
  <button [disabled]="!store.canUndo()" (click)="undo()">{{ 'grid.undo' | translate }}</button>
  <button [disabled]="!store.canRedo()" (click)="redo()">{{ 'grid.redo' | translate }}</button>
  @if (store.invalidCellValues().size) {
    <span class="invalid-tag">{{ 'grid.invalidGrid' | translate }}</span>
  }
  <button class="clear-button" (click)="onClickClearCells()">{{ 'grid.clearCells' | translate }}</button>
</div>
